server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: incident-tracker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/incidents}
    username: ${DB_USER:incidents}
    password: ${DB_PASSWORD:incidents}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Local development secret (256-bit base64); override via JWT_SECRET in production
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtMjU2LWJpdC1zZWNyZXQtaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudC0xMjM0NTY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
